<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes souhaits</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes souhaits">
<meta name="theme-color" content="#d9ecff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#d9ecff,#e4dcff);color:#1d2a4a;-webkit-text-size-adjust:100%}
#kid{position:fixed;inset:0;overflow:auto;padding:22px 16px 120px}
</style>
</head>
<body>
<div id="kid"></div>
<script>
let db=null,extras=[],items=[];
const FBC={apiKey:"AIzaSyBYNEjVg4wrSLJRo6wMXl_Hd9lb2JDeHO0",authDomain:"liste-noel-lilou.firebaseapp.com",projectId:"liste-noel-lilou",storageBucket:"liste-noel-lilou.firebasestorage.app",messagingSenderId:"1037196943479",appId:"1:1037196943479:web:540fcf7d56f238043a2672"};
(async()=>{try{const b="https://www.gstatic.com/firebasejs/10.14.1/";const [A,F]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-firestore.js")]);const app=A.initializeApp(FBC),fs=F.getFirestore(app);
db={collection:c=>({add:d=>F.addDoc(F.collection(fs,c),d)})};
F.onSnapshot(F.collection(fs,"extras"),x=>{extras=x.docs.map(d=>Object.assign({id:d.id},d.data()));window.__kidRender&&window.__kidRender()},()=>{});
F.onSnapshot(F.collection(fs,"items"),x=>{items=x.docs.map(d=>Object.assign({id:d.id},d.data()));window.__kidRender&&window.__kidRender()},()=>{})}catch(e){}})();
(function(){
const CATS={noel:"🎄 Noël",anniv:"🎂 Anniversaire",envie:"💖 Envie"};
const KIDS={lilou:"Lilou",mahily:"Mahily",didi:"Didi"};
const hh=t=>{let a=5381;for(const c of "kid|"+t)a=((a<<5)+a+c.charCodeAt(0))>>>0;return String(a)};
const WHO={"3221070337":"lilou","3221107392":"mahily","3221108454":"didi"};
const safeUrl=u=>u&&/^https:\/\//i.test(u)?u:null;
const isW=x=>x&&typeof x.name==="string"&&x.name.indexOf("souhait:")===0;
const parseW=x=>{let o={};try{o=JSON.parse(x.url||"{}")||{}}catch(e){}
  return{id:x.id,kid:x.name.slice(8),n:String(x.gift||""),l:safeUrl(o.l)||"",i:(typeof o.i==="string"&&o.i.indexOf("data:image/")===0)?o.i:"",p:String(o.p||""),c:CATS[o.c]?o.c:"",at:x.at||0}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb=w=>'<div style="width:64px;height:64px;flex:none;border-radius:14px;background:#eaf2ff;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px">'+(w.i?'<img src="'+w.i+'" style="width:100%;height:100%;object-fit:cover" alt="">':'🎁')+'</div>';
function shrink(file,max,q,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",q))};im.onerror=()=>cb("");im.src=r.result};r.readAsDataURL(file)}
let K=null;try{const w=localStorage.getItem("kidwho");if(KIDS[w])K=w}catch(e){}
const g=id=>document.getElementById(id);

function kidRender(){
  const L=g("kd_list");if(!L||!K)return;
  const ws=extras.filter(isW).map(parseW).filter(w=>w.kid===K).sort((a,b)=>b.at-a.at).concat(items.filter(x=>x.from===K||String(x.s||"").indexOf("Idée de "+KIDS[K])===0).map(x=>({n:String(x.n||""),i:(typeof x.img==="string"&&x.img.indexOf("data:image/")===0)?x.img:"",p:x.p!=null?String(x.p).replace(".",",")+" €":"",c:"",ok:1,at:0})));
  L.innerHTML="";
  if(!ws.length){L.innerHTML='<p style="text-align:center;opacity:.75;margin:30px 10px">Appuie sur le <b>+</b> pour ajouter ton premier souhait ✨</p>';return}
  ws.forEach(w=>{const d=document.createElement("div");
    d.style.cssText="display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;margin:10px 0;box-shadow:0 4px 14px rgba(80,90,180,.12)";
    d.innerHTML=thumb(w)+'<div style="flex:1;min-width:0"><div style="font-weight:700;overflow-wrap:anywhere">'+esc(w.n)+'</div>'+(w.p?'<div style="color:#e8478b;font-weight:700">'+esc(w.p)+'</div>':'')+'<div style="font-size:13px;opacity:.75">'+(w.c?CATS[w.c]+' · ':'')+(K==="didi"?'📋 Dans ta liste':(w.ok?'✅ Accepté par les parents !':'💌 Les parents vont regarder'))+'</div></div>';
    L.appendChild(d)})}

function icon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");const gr=x.createLinearGradient(0,0,180,180);gr.addColorStop(0,"#e8478b");gr.addColorStop(1,"#9b7bff");x.fillStyle=gr;x.fillRect(0,0,180,180);x.textAlign="center";x.textBaseline="middle";x.font="96px serif";x.fillText("\u{1F381}",90,92);x.font="34px serif";x.fillText("✨",148,34);
  const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l);
  const l2=document.createElement("link");l2.rel="icon";l2.href=l.href;document.head.appendChild(l2)}catch(e){}}

function clean(){["kd_fab","kd_sh"].forEach(i=>{const e=g(i);if(e)e.remove()})}

function showPin(){
  clean();const o=g("kid");
  o.innerHTML='<div style="max-width:360px;margin:12vh auto 0;text-align:center"><div style="font-size:64px">🎁</div><h1 style="font-size:24px;margin:8px 0 4px">Mes souhaits</h1><p style="margin:0 0 18px;opacity:.8">Tape ton code secret</p>'
   +'<input id="kd_pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="width:100%;box-sizing:border-box;text-align:center;font-size:34px;letter-spacing:12px;padding:14px;border:2px solid #cfd9ff;border-radius:16px;margin-bottom:12px">'
   +'<button id="kd_go" style="width:100%;padding:15px;border:0;border-radius:14px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e8478b,#9b7bff);cursor:pointer">Entrer ✨</button>'
   +'<p id="kd_err" style="color:#d6336c;min-height:22px;margin-top:10px"></p></div>';
  const go=()=>{const w=WHO[hh(g("kd_pin").value.trim())];
    if(!w){g("kd_err").textContent="Ce n’est pas le bon code 🙈";g("kd_pin").value="";return}
    K=w;try{localStorage.setItem("kidwho",w)}catch(e){}showList()};
  g("kd_go").onclick=go;g("kd_pin").onkeydown=e=>{if(e.key==="Enter")go()}}

function showList(){
  clean();const o=g("kid");
  o.innerHTML='<div style="max-width:520px;margin:0 auto"><h1 style="text-align:center;font-size:24px;margin:10px 0 4px">✨ Les souhaits de '+KIDS[K]+' ✨</h1><p style="text-align:center;margin:0 0 14px;opacity:.8">Ajoute ici ce dont tu rêves</p><div id="kd_list"></div>'
   +'<p style="text-align:center;margin-top:28px"><a href="#" id="kd_out" style="color:#5a6a9a;font-size:14px">🔒 Changer d’enfant</a></p></div>'
   +'<button id="kd_fab" aria-label="Ajouter un souhait" style="position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;border:0;font-size:38px;line-height:1;color:#fff;background:linear-gradient(135deg,#e8478b,#9b7bff);box-shadow:0 8px 22px rgba(120,80,200,.45);cursor:pointer">+</button>';
  g("kd_out").onclick=e=>{e.preventDefault();try{localStorage.removeItem("kidwho")}catch(x){}K=null;showPin()};
  const sh=document.createElement("div");sh.id="kd_sh";
  sh.style.cssText="display:none;position:fixed;inset:0;z-index:10000;background:rgba(20,30,70,.5);align-items:flex-end;justify-content:center";
  const I="width:100%;box-sizing:border-box;padding:12px;border:2px solid #d9e2ff;border-radius:12px;font-size:16px;margin:4px 0 12px;font-family:inherit";
  let cat="noel";
  const chips=Object.keys(CATS).map(k=>'<button type="button" data-c="'+k+'" class="kd_chip" style="flex:1;padding:12px 4px;border:2px solid #d9e2ff;border-radius:14px;background:#fff;font-size:15px;font-weight:700;color:#1d2a4a;cursor:pointer">'+CATS[k]+'</button>').join("");
  sh.innerHTML='<div style="background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;color:#1d2a4a">'
   +'<h2 style="margin:0 0 12px">🎁 Mon nouveau souhait</h2>'
   +'<label><b>C’est pour quoi ?</b></label><div style="display:flex;gap:8px;margin:6px 0 14px">'+chips+'</div>'
   +'<label><b>Le nom du cadeau</b></label><input id="kd_n" maxlength="80" placeholder="Ex : LEGO Friends…" style="'+I+'">'
   +'<label><b>Le lien</b> (copié depuis Internet)</label><input id="kd_l" inputmode="url" autocapitalize="off" placeholder="https://…" style="'+I+'">'
   +'<label><b>Ou une photo</b></label><input id="kd_f" type="file" accept="image/*" style="'+I+'">'
   +'<label><b>Le prix</b> (si tu le sais)</label><input id="kd_p" maxlength="20" placeholder="Ex : 19,99 €" style="'+I+'">'
   +'<button id="kd_ok" style="width:100%;padding:15px;border:0;border-radius:14px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e8478b,#9b7bff);cursor:pointer">'+(K==="didi"?"Ajouter à ma liste 💌":"Envoyer aux parents 💌")+'</button>'
   +'<button id="kd_no" style="width:100%;padding:12px;border:0;background:none;font-size:16px;margin-top:6px;color:#5a6a9a;cursor:pointer">Annuler</button></div>';
  document.body.appendChild(sh);
  const paint=()=>sh.querySelectorAll(".kd_chip").forEach(b=>{const on=b.dataset.c===cat;b.style.borderColor=on?"#9b7bff":"#d9e2ff";b.style.background=on?"#efe9ff":"#fff"});
  sh.querySelectorAll(".kd_chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;paint()});paint();
  g("kd_fab").onclick=()=>{sh.style.display="flex"};
  g("kd_no").onclick=()=>{sh.style.display="none"};
  g("kd_ok").onclick=()=>{
    const n=g("kd_n").value.trim();let l=g("kd_l").value.trim();const p=g("kd_p").value.trim();const f=g("kd_f").files[0];
    if(!n){alert("Écris le nom du cadeau 😊");return}
    if(l&&!/^https?:\/\//i.test(l))l="https://"+l;
    if(!db){alert("Pas de connexion pour le moment, réessaie dans un instant.");return}
    const b=g("kd_ok");b.disabled=true;
    const go=async img=>{
      try{await db.collection("extras").add({name:"souhait:"+K,gift:n,url:JSON.stringify({l:l,i:img||"",p:p,c:cat}),at:Date.now()});
        g("kd_n").value="";g("kd_l").value="";g("kd_p").value="";g("kd_f").value="";sh.style.display="none";alert(K==="didi"?"C’est ajouté à ta liste ! 🎁":"C’est envoyé aux parents ! 🎄")}
      catch(e){alert("Oups, ça n’a pas marché. Réessaie.")}
      b.disabled=false};
    if(f)shrink(f,380,0.78,go);else go("")};
  kidRender()}


let DP=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e});
if(!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)&&!navigator.standalone){
const ib=document.createElement("button");ib.id="kd_inst";ib.textContent="📲 Installer l’appli";
ib.style.cssText="position:fixed;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:9000;border:0;border-radius:22px;padding:12px 16px;font-size:15px;font-weight:700;color:#5a3fc0;background:#fff;box-shadow:0 6px 18px rgba(80,90,180,.25);cursor:pointer";
ib.onclick=async()=>{
 if(DP){DP.prompt();try{await DP.userChoice}catch(e){}DP=null;return}
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 alert(ios?"Pour installer :\n1) Appuie sur Partager (le carré avec la flèche)\n2) Choisis « Sur l’écran d’accueil »\n3) Ajouter":"Pour installer :\n1) Appuie sur les 3 points ⋮ en haut à droite de Chrome\n2) Choisis « Installer l’application » ou « Ajouter à l’écran d’accueil »\n3) Confirme")};
document.body.appendChild(ib)}
window.__kidRender=kidRender;
icon();
if(K)showList();else showPin();
})();
</script>
</body>
</html>
