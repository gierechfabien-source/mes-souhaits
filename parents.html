function dests(kid,ex){
 const t=todayS(),Y=+t.slice(0,4),out=[],seen={};
 if(kid==="lilou"){out.push({legacy:"m",type:"noel",d:"2026-12-25",n:"Noël 2026 · Chez Maman"},{legacy:"p",type:"noel",d:"2026-12-25",n:"Noël 2026 · Chez Papa"})}
 metas().filter(m=>m.kid===kid&&m.oid!==ex).forEach(m=>{seen[m.oid]=1;out.push({def:m,ex:1,type:m.type,d:m.d,n:m.n})});
 const add=q=>{if(!q||seen[q.oid]||q.oid===ex||q.d<t)return;if(kid==="lilou"&&q.oid==="lilou_noel2026")return;seen[q.oid]=1;out.push({def:q,type:q.type,d:q.d,n:q.n})};
 [Y,Y+1,Y+2].forEach(y=>add(defOcc(kid,"noel",y)));
 [Y,Y+1].forEach(y=>add(defOcc(kid,"anniv",y)));
 (SLOTS[kid]||[]).forEach(add);
 const nl=out.filter(o=>!o.ex&&!o.legacy&&o.type==="noel").slice(0,2);
 return out.filter(o=>o.ex||o.legacy||o.type!=="noel"||nl.indexOf(o)>=0).sort((a,b)=>String(a.d).localeCompare(String(b.d)))}
