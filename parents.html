<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les filles – Parents</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parents">
<meta name="theme-color" content="#f3f6ff">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f6ff;color:#1d2a4a;padding:18px 14px 40px}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:4px 4px 2px}.s{margin:0 4px 14px;opacity:.65;font-size:14px}
.alert{background:#fff4d6;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:14px;text-decoration:none;color:inherit}
.alert b{color:#8a5a00}.alert .go{margin-left:auto;font-weight:800;color:#8a5a00}
h2{font-size:17px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.c{background:#fff;border-radius:18px;padding:13px 14px;margin:9px 0;box-shadow:0 3px 12px rgba(80,90,180,.1)}
.r{display:flex;align-items:center;gap:12px}.e{font-size:28px}.t{flex:1;min-width:0}.t b{display:block;font-size:16px}.t small{opacity:.65}
.send{display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:11px 14px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,#25b866,#1a9e8f);cursor:pointer;white-space:nowrap}
.send.off{background:#e9ecf5;color:#8a93b5;cursor:default}
.w{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;margin:7px 0}
.th{width:44px;height:44px;flex:none;border-radius:10px;background:#eaf2ff;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px}.th img{width:100%;height:100%;object-fit:cover}
.w .t b{font-size:15px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:800;border-radius:10px;padding:4px 9px;white-space:nowrap}.p{background:#fff0c9;color:#8a5a00}.k{background:#d9f7e3;color:#13693a}.d{background:#fde3f1;color:#a0246a}
.empty{opacity:.6;text-align:center;margin:10px}
</style>
</head>
<body>
<main>
<h1>Les filles</h1><p class="s">Listes, souhaits et liens à envoyer</p>
<div id="out"></div>
</main>
<script>
let extras=[],items=[];
const FBC={"apiKey":"AIzaSyBYNEjVg4wrSLJRo6wMXl_Hd9lb2JDeHO0","authDomain":"liste-noel-lilou.firebaseapp.com","projectId":"liste-noel-lilou","storageBucket":"liste-noel-lilou.firebasestorage.app","messagingSenderId":"1037196943479","appId":"1:1037196943479:web:540fcf7d56f238043a2672"};
(async()=>{try{const b="https://www.gstatic.com/firebasejs/10.14.1/";const [A,F]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-firestore.js")]);const app=A.initializeApp(FBC),fs=F.getFirestore(app);
F.onSnapshot(F.collection(fs,"extras"),x=>{extras=x.docs.map(d=>Object.assign({id:d.id},d.data()));paint()},()=>{});
F.onSnapshot(F.collection(fs,"items"),x=>{items=x.docs.map(d=>Object.assign({id:d.id},d.data()));paint()},()=>{})}catch(e){}})();

const O=location.origin;
const KIDS={lilou:"Lilou",mahily:"Mahily",didi:"Didi"};
const CL={noel:"🎄 Noël",anniv:"🎂 Anniversaire",envie:"💖 Envie"};
const LN={m:"Chez Maman",p:"Chez Papa"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe=u=>u&&/^https:\/\//i.test(u)?u:"";
function pend(x){if(!x||typeof x.name!=="string"||x.name.indexOf("souhait:")!==0)return null;let o={};try{o=JSON.parse(x.url||"{}")||{}}catch(e){}
 return{kid:x.name.slice(8),n:String(x.gift||""),i:(typeof o.i==="string"&&o.i.indexOf("data:image/")===0)?o.i:"",c:o.c||"",at:x.at||0}}
function acc(x){let kid=x.from;const s=String(x.s||"");if(!kid){const m=/Idée de (Lilou|Mahily)/.exec(s);if(m)kid=m[1].toLowerCase()}
 if(!kid||!KIDS[kid])return null;return{kid,n:String(x.n||""),i:(typeof x.img==="string"&&x.img.indexOf("data:image/")===0)?x.img:"",list:x.list}}
window.share=function(url,text){const d={title:"Liste de cadeaux",text:text+"\n",url:url};
 if(navigator.share){navigator.share(d).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(text+"\n"+url).then(()=>alert("Lien copié, tu peux le coller dans un message 👍"),()=>prompt("Copie ce lien :",url))}
 else prompt("Copie ce lien :",url)};
const occ=(e,t,sub,url,text)=>'<div class="c"><div class="r"><div class="e">'+e+'</div><div class="t"><b>'+t+'</b><small>'+sub+'</small></div>'+(url?'<button class="send" data-u="'+esc(url)+'" data-t="'+esc(text)+'">📤 Envoyer le lien</button>':'<button class="send off" disabled>📤 Envoyer</button>')+'</div></div>';
const row=(w,st)=>'<div class="w"><div class="th">'+(w.i?'<img src="'+w.i+'" alt="">':'🎁')+'</div><div class="t"><b>'+esc(w.n)+'</b><small>'+(w.c&&CL[w.c]?CL[w.c]+' · ':'')+esc(KIDS[w.kid]||w.kid)+'</small></div><span class="pill '+st[0]+'">'+st[1]+'</span></div>';
function paint(){const P=extras.map(pend).filter(Boolean).sort((a,b)=>b.at-a.at);const A=items.map(acc).filter(Boolean);
 const nPend=P.filter(w=>w.kid!=="didi").length,nDidi=P.filter(w=>w.kid==="didi").length;
 let h="";
 if(nPend)h+='<a class="alert" href="/liste-noel-lilou/">⏳ <span><b>'+nPend+' souhait'+(nPend>1?'s':'')+'</b> attend'+(nPend>1?'ent':'')+' ta validation</span><span class="go">Valider ›</span></a>';
 h+='<h2><span class="dot" style="background:#4f8dff"></span>Lilou</h2>';
 h+=occ("🎄","Noël 2026","Chez Maman et Chez Papa",O+"/liste-noel-lilou/","🎄 La liste de cadeaux de Lilou est prête ! Tu peux réserver un cadeau ici :");
 h+=occ("🎂","9 ans · 11 juin 2027","Liste à créer");
 h+='<h2><span class="dot" style="background:#ff7eb6"></span>Mahily</h2>';
 h+=occ("🎄","Noël 2026","Liste à créer");
 h+=occ("🎂","12 ans · 22 décembre 2026","Liste à créer");
 h+='<h2><span class="dot" style="background:#9b7bff"></span>Didi</h2>';
 h+=occ("🎁","La liste de Didi",nDidi+" idée"+(nDidi>1?"s":""),O+"/mes-souhaits/didi.html","🎁 La liste d’idées cadeaux de Didi est prête ! Tu peux réserver un cadeau ici :");
 h+='<h2>💌 Souhaits reçus</h2>';
 const rows=P.filter(w=>w.kid!=="didi").map(w=>row(w,["p","⏳ À valider"])).concat(A.map(w=>row(w,["k","✅ Accepté · "+(LN[w.list]||"dans la liste")])),P.filter(w=>w.kid==="didi").map(w=>row(w,["d","📋 Dans sa liste"])));
 h+=rows.length?rows.join(""):'<p class="empty">Pas encore de souhait</p>';
 document.getElementById("out").innerHTML=h;
 document.querySelectorAll(".send[data-u]").forEach(b=>b.onclick=()=>share(b.dataset.u,b.dataset.t))}
paint();
</script>
</body>
</html>
