</div>

<script>
let extras=[],items=[],owner=false,FB=null,user=undefined;
const hh=t=>{let a=5381;for(const c of t)a=((a<<5)+a+c.charCodeAt(0))>>>0;return a};
const FBC={"apiKey":"AIzaSyBYNEjVg4wrSLJRo6wMXl_Hd9lb2JDeHO0","authDomain":"liste-noel-lilou.firebaseapp.com","projectId":"liste-noel-lilou","storageBucket":"liste-noel-lilou.firebasestorage.app","messagingSenderId":"1037196943479","appId":"1:1037196943479:web:540fcf7d56f238043a2672"};
(async()=>{try{
const A=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
const F=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

const app=A.initializeApp(FBC);const fs=F.getFirestore(app);const au=U.getAuth(app);
const prov=new U.GoogleAuthProvider();
FB={add:(c,d)=>F.addDoc(F.collection(fs,c),d),set:(c,id,d)=>F.setDoc(F.doc(fs,c,id),d),del:(c,id)=>F.deleteDoc(F.doc(fs,c,id)),
 signIn:async()=>{try{await U.signInWithPopup(au,prov)}catch(e){await U.signInWithRedirect(au,prov)}},signOut:()=>U.signOut(au)};
U.onAuthStateChanged(au,u=>{user=u||null;owner=!!(u&&u.emailVerified&&hh(String(u.email||"").toLowerCase())===1357359238);paint()});
F.onSnapshot(F.collection(fs,"extras"),s=>{extras=s.docs.map(d=>Object.assign({id:d.id},d.data()));paint()});
F.onSnapshot(F.collection(fs,"items"),s=>{items=s.docs.map(d=>d.data());paint()});
}catch(e){console.error(e);user=null;paint()}})();

const O=location.origin;
const KIDS={lilou:"Lilou",mahily:"Mahily",didi:"Didi"};
const CL={noel:"🎄 Noël",anniv:"🎂 Anniversaire",envie:"💖 Envie"};
const CT={noel:"Noël",anniv:"Anniversaire",envie:"Envie"};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe=u=>u&&/^https:\/\//i.test(u)?u:"";
const $=id=>document.getElementById(id);
function pend(x){if(!x||typeof x.name!=="string"||x.name.indexOf("souhait:")!==0)return null;let o={};try{o=JSON.parse(x.url||"{}")||{}}catch(e){}
 return{id:x.id,kid:x.name.slice(8),n:String(x.gift||""),i:(typeof o.i==="string"&&o.i.indexOf("data:image/")===0)?o.i:"",p:String(o.p||""),l:safe(o.l),c:o.c||"",at:x.at||0}}
function acc(x){let kid=x.from;const s=String(x.s||"");if(!kid){const m=/Idée de (Lilou|Mahily)/.exec(s);if(m)kid=m[1].toLowerCase()}
 if(!kid||!KIDS[kid])return null;return{kid,n:String(x.n||""),i:(typeof x.img==="string"&&x.img.indexOf("data:image/")===0)?x.img:"",list:x.list}}
window.share=function(url,text){const d={title:"Liste de cadeaux",text:text+"\n",url:url};
 if(navigator.share){navigator.share(d).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(text+"\n"+url).then(()=>alert("Lien copié, tu peux le coller dans un message 👍"),()=>prompt("Copie ce lien :",url))}
 else prompt("Copie ce lien :",url)};
const occ=(e,t,sub,url,text,manage)=>'<div class="c"><div class="r"><div class="e">'+e+'</div><div class="t"><b>'+t+'</b><small>'+sub+'</small></div>'+(url?'<button class="send" data-u="'+esc(url)+'" data-t="'+esc(text)+'">📤 Envoyer le lien</button>':'<button class="send off" disabled>📤 Envoyer</button>')+'</div>'+(manage?'<a class="mg" href="'+manage+'">⚙️ Gérer cette liste</a>':'')+'</div>';
const thumb=w=>'<div class="th">'+(w.i?'<img src="'+w.i+'" alt="">':'🎁')+'</div>';
const lnk=w=>w.l?' <a href="'+esc(w.l)+'" target="_blank" rel="noopener">🔗</a>':'';
const row=(w,st,acts)=>'<div class="w">'+thumb(w)+'<div class="t"><b>'+esc(w.n)+'</b><small>'+(w.c&&CL[w.c]?CL[w.c]+' · ':'')+esc(KIDS[w.kid]||w.kid)+(w.p?' · '+esc(w.p):'')+lnk(w)+'</small></div><span class="pill '+st[0]+'">'+st[1]+'</span>'+(acts||'')+'</div>';
function paint(){
 document.body.className=user===undefined?'wait':(user?'in':'out');
 if(!user)return;
 const P=extras.map(pend).filter(Boolean).sort((a,b)=>b.at-a.at);const A=items.map(acc).filter(Boolean);
 const K=P.filter(w=>w.kid!=="didi"),D=P.filter(w=>w.kid==="didi");
 let h="";
 if(K.length)h+='<div class="alert">⏳ <span><b>'+K.length+' souhait'+(K.length>1?'s':'')+'</b> à valider'+(owner?'':' <small>(seul Fabien peut valider)</small>')+'</span></div>';
 h+='<h2><span class="dot" style="background:#4f8dff"></span>Lilou</h2>';
 h+=occ("🎄","Noël 2026","Chez Maman et Chez Papa",O+"/liste-noel-lilou/","🎄 La liste de cadeaux de Lilou est prête ! Tu peux réserver un cadeau ici :",owner?"/liste-noel-lilou/":"");
 h+=occ("🎂","9 ans · 11 juin 2027","Liste à créer");
 h+='<h2><span class="dot" style="background:#ff7eb6"></span>Mahily</h2>';
 h+=occ("🎄","Noël 2026","Liste à créer");
 h+=occ("🎂","12 ans · 22 décembre 2026","Liste à créer");
 h+='<h2><span class="dot" style="background:#9b7bff"></span>Didi</h2>';
 h+=occ("🎁","La liste de Didi",D.length+" idée"+(D.length>1?"s":""),O+"/mes-souhaits/didi.html","🎁 La liste d’idées cadeaux de Didi est prête ! Tu peux réserver un cadeau ici :");
 D.forEach(w=>{h+=row(w,["d","📋 Dans sa liste"],owner?'<div class="act"><button class="bd" data-del="'+w.id+'">🗑 Retirer</button></div>':'')});
 h+='<button class="add" id="addb">＋ Ajouter une idée à la liste de Didi</button>';
 h+='<h2>💌 Souhaits des filles</h2>';
 const rows=K.map(w=>row(w,["p","⏳ À valider"],owner?'<div class="act"><button class="bm" data-acc="'+w.id+'" data-l="m">→ Chez Maman</button><button class="bp" data-acc="'+w.id+'" data-l="p">→ Chez Papa</button><button class="bn" data-del="'+w.id+'">Refuser</button></div>':'')).concat(A.map(w=>row(w,["k","✅ Accepté · "+(LN[w.list]||"dans la liste")])));
 h+=rows.length?rows.join(""):'<p class="empty">Pas encore de souhait</p>';
 $("out").innerHTML=h;
 document.querySelectorAll(".send[data-u]").forEach(b=>b.onclick=()=>share(b.dataset.u,b.dataset.t));
 document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>accept(b.dataset.acc,b.dataset.l,b));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>refuse(b.dataset.del,b));
 $("addb").onclick=()=>{$("sh").style.display="flex"};
 $("who").textContent=owner?"Gestion complète":"Lecture et idées de Didi";$("au").className="auth"+(owner?" on":"")}
async function accept(id,list,b){const w=extras.map(pend).filter(Boolean).find(x=>x.id===id);if(!w||!FB||!owner)return;
 b.disabled=true;const p=parseFloat(String(w.p).replace(",",".").replace(/[^\d.]/g,""));
 const d={n:w.n,p:isNaN(p)?null:p,from:w.kid,s:(CT[w.c]?CT[w.c]+" · ":"")+"Idée de "+(KIDS[w.kid]||w.kid),u:w.l||"",list:list};if(w.i)d.img=w.i;
 try{await FB.set("items","n"+Date.now(),d);await FB.del("extras",id)}catch(e){alert("Ça n’a pas marché (es-tu bien connecté avec ton compte ?)");b.disabled=false}}
async function refuse(id,b){if(!FB||!owner)return;if(!confirm("Retirer ce souhait ?"))return;b.disabled=true;try{await FB.del("extras",id)}catch(e){alert("Ça n’a pas marché");b.disabled=false}}
window.shrink=function(file,max,q,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",q))};im.onerror=()=>cb("");im.src=r.result};r.readAsDataURL(file)};
$("no").onclick=()=>{$("sh").style.display="none"};
$("ok").onclick=()=>{const n=$("n").value.trim();let l=$("l").value.trim();const p=$("p").value.trim();const f=$("f").files[0];
 if(!n){alert("Écris le nom du cadeau 😊");return}if(l&&!/^https?:\/\//i.test(l))l="https://"+l;
 if(!FB){alert("Pas de connexion, réessaie dans un instant.");return}
 const b=$("ok");b.disabled=true;
 const go=async img=>{try{await FB.add("extras",{name:"souhait:didi",gift:n,url:JSON.stringify({l:l,i:img||"",p:p,c:"envie"}),at:Date.now()});
  $("n").value="";$("l").value="";$("p").value="";$("f").value="";$("sh").style.display="none"}catch(e){alert("Oups, ça n’a pas marché. Réessaie.")}b.disabled=false};
 if(f)shrink(f,380,0.78,go);else go("")};
const doIn=async()=>{if(!FB){$("lh").textContent="Chargement… réessaie dans un instant.";return}
 try{await FB.signIn()}catch(e){$("lh").textContent="Connexion impossible. Réessaie."}};
$("lg").onclick=doIn;
$("au").onclick=()=>{if(FB&&confirm("Te déconnecter ?"))FB.signOut()};
let DP=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e});
const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
if(standalone)$("li").style.display="none";
$("li").onclick=async()=>{
 if(DP){DP.prompt();try{await DP.userChoice}catch(e){}DP=null;return}
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 alert(ios?"Pour installer :\n1) Appuie sur Partager (le carré avec la flèche)\n2) Choisis « Sur l’écran d’accueil »\n3) Ajouter":"Pour installer :\n1) Appuie sur les 3 points ⋮ en haut à droite de Chrome\n2) Choisis « Installer l’application » ou « Ajouter à l’écran d’accueil »\n3) Confirme")};
try{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=180;c.getContext("2d").drawImage(im,0,0,180,180);const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}};im.src="icon-parents.svg"}catch(e){}
paint();
</script>
